<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c63d9">
<title>Morgonrutiner</title>
<style>
*{box-sizing:border-box}
:root{--purple:#6c63d9;--green:#63b77a;--ink:#26324a;--muted:#6c7890;--bg1:#f8f6ff;--bg2:#edfaff}
body{margin:0;background:linear-gradient(145deg,var(--bg1),var(--bg2));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:680px;margin:auto;min-height:100vh;padding:16px 16px 30px}
.header{text-align:center}.header h1{margin:4px 0 2px;font-size:34px;line-height:1.1}.subtitle{color:var(--muted);font-size:16px}
.total-wrap{display:flex;justify-content:center;margin:11px 0 12px}.timer{display:inline-flex;align-items:center;gap:8px;background:#fff;padding:8px 18px;border-radius:18px;font-size:27px;font-weight:900;box-shadow:0 5px 20px #0001}
.progress{height:12px;background:#dedbf0;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--purple);transition:width .35s ease}
.progress-label{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:13px;font-weight:800}
.dots{display:flex;justify-content:center;gap:8px;margin:18px 0 4px}.dot{width:13px;height:13px;border-radius:50%;background:#dedbf0;transition:.25s}.dot.done{background:var(--green)}.dot.current{background:var(--purple);transform:scale(1.35)}
.card{margin-top:17px;background:#fff;border-radius:30px;padding:26px 20px;text-align:center;box-shadow:0 8px 28px #00000012}.hidden{display:none}
.step{color:var(--muted);font-weight:900;letter-spacing:.3px}.name{font-size:32px;font-weight:950;margin:14px 0 10px;line-height:1.1}.hint{color:var(--muted);font-size:16px;margin:0 auto 14px;max-width:430px}
.step-image{display:block;width:min(100%,430px);height:270px;object-fit:contain;object-position:center;background:#f8f8f8;border-radius:20px;margin:12px auto 10px;box-shadow:0 4px 14px #00000012}
.stepTimer{font-size:29px;font-weight:900;margin:5px 0 4px}.time-label{font-size:13px;color:var(--muted);font-weight:800}
button{width:100%;border:0;border-radius:20px;padding:19px;margin-top:13px;font-size:21px;font-weight:900;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:active{transform:scale(.98)}
.start,.primary{background:var(--purple);color:#fff}.done{background:var(--green);color:#fff;font-size:24px;padding:21px}.skip{background:#eef0f6;color:var(--ink)}
.welcome-icon{font-size:86px;line-height:1;margin:8px 0 14px}.finish-icon{font-size:96px;line-height:1}.finish-title{font-size:36px;font-weight:950;margin:4px 0}.celebrate{font-size:19px;font-weight:850}
.result{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid #eee;text-align:left}.result:last-child{border:0}.result span{overflow:hidden;text-overflow:ellipsis}.result b{white-space:nowrap}.total-result{font-size:18px;margin-top:4px}
.tip{text-align:center;color:var(--muted);font-size:13px;margin:14px 8px 0}
.confetti{position:fixed;left:50%;top:30%;pointer-events:none;font-size:30px;animation:fly 900ms ease-out forwards;z-index:10}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.7) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(var(--r))}}
.pop{animation:pop .32s ease-out}@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:scale(1);opacity:1}}
@media(max-width:420px){.app{padding-left:12px;padding-right:12px}.header h1{font-size:30px}.name{font-size:29px}.step-image{height:250px}}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1 id="title"></h1><div id="subtitle" class="subtitle"></div>
<div class="total-wrap"><div id="total" class="timer"></div></div>
<div class="progress"><span id="bar"></span></div>
<div class="progress-label"><span id="progressText"></span><span id="percent"></span></div>
<div id="dots" class="dots"></div>
</div>

<section id="welcome" class="card">
<div class="welcome-icon">&#127774;</div>
<div id="welcomeName" class="name"></div>
<p id="welcomeHint" class="hint"></p>
<button id="start" class="start"></button>
</section>

<section id="stepCard" class="card hidden">
<div id="step" class="step"></div>
<img id="stepImage" class="step-image" alt="">
<div id="name" class="name"></div>
<div id="hint" class="hint"></div>
<div id="timeLabel" class="time-label"></div><div id="stepTimer" class="stepTimer">00:00</div>
<button id="done" class="done"></button><button id="skip" class="skip"></button>
</section>

<section id="finish" class="card hidden">
<div class="finish-icon">&#127881;</div><div id="finishTitle" class="finish-title"></div>
<p id="celebrate" class="celebrate"></p><div id="miniStars" class="mini-stars"></div>
<div id="results"></div><button id="again" class="primary"></button>
</section>
<div id="tip" class="tip"></div>
</div>

let i=0,totalStart=0,stepStart=0,timer=null,times=[];
const $=id=>document.getElementById(id);
const fmt=ms=>{let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")};
function drawDots(){$("dots").innerHTML=steps.map((_,n)=>'<span class="'+(n<i?"dot done":n===i?"dot current":"dot")+'"></span>').join("")}
function tick(){if(!totalStart)return;$("total").textContent=T.timer+" "+fmt(Date.now()-totalStart);$("stepTimer").textContent=fmt(Date.now()-stepStart)}
function render(){
 $("step").textContent="STEG "+(i+1)+" AV "+steps.length;
 $("stepImage").src=steps[i][1];$("stepImage").alt=steps[i][0];
 $("name").textContent=steps[i][0];$("hint").textContent=steps[i][2];
 const pct=Math.round(i/steps.length*100);$("bar").style.width=pct+"%";$("progressText").textContent=i+" av "+steps.length+" klara";$("percent").textContent=pct+"%";drawDots();
 $("stepCard").classList.remove("pop");void $("stepCard").offsetWidth;$("stepCard").classList.add("pop");tick()
}
function celebrate(){
 const e=[T.star,T.party,U(0x2728),T.star,T.rocket];
 for(let n=0;n<10;n++){const el=document.createElement("div");el.className="confetti";el.textContent=e[Math.floor(Math.random()*e.length)];el.style.setProperty("--x",(Math.random()*360-180)+"px");el.style.setProperty("--y",(Math.random()*-300-80)+"px");el.style.setProperty("--r",(Math.random()*360-180)+"deg");el.style.animationDelay=(Math.random()*180)+"ms";document.body.appendChild(el);setTimeout(()=>el.remove(),1200)}
}
function startRoutine(){i=0;times=[];totalStart=Date.now();stepStart=totalStart;$("welcome").classList.add("hidden");$("finish").classList.add("hidden");$("stepCard").classList.remove("hidden");clearInterval(timer);timer=setInterval(tick,250);render()}
function next(skipped){
 times.push({name:steps[i][0],ms:Date.now()-stepStart,skipped});if(!skipped)celebrate();i++;
 if(i>=steps.length){clearInterval(timer);timer=null;$("stepCard").classList.add("hidden");$("finish").classList.remove("hidden");$("bar").style.width="100%";$("progressText").textContent=steps.length+" av "+steps.length+" klara";$("percent").textContent="100%";drawDots();
 $("results").innerHTML=times.map((x,n)=>'<div class="result"><span>'+(n+1)+". "+x.name+'</span><b>'+(x.skipped?"-":fmt(x.ms))+"</b></div>").join("")+'<div class="result total-result"><b>Total tid</b><b>'+fmt(Date.now()-totalStart)+"</b></div>";celebrate();setTimeout(celebrate,220)
 }else{stepStart=Date.now();render()}
}
$("start").onclick=startRoutine;$("done").onclick=()=>next(false);$("skip").onclick=()=>next(true);
$("again").onclick=()=>{$("finish").classList.add("hidden");$("welcome").classList.remove("hidden");$("total").textContent=T.timer+" 00:00";$("bar").style.width="0%";$("progressText").textContent="Redo?";$("percent").textContent="0%";i=0;drawDots()};
$("total").textContent=T.timer+" 00:00";$("progressText").textContent="Redo?";$("percent").textContent="0%";drawDots();
</script>
</body>
</html>
